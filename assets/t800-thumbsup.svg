<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- thumb -->
  <rect x="70" y="20" width="30" height="60" rx="15" fill="#888"/>
  <!-- fist body -->
  <rect x="50" y="70" width="100" height="90" rx="10" fill="#999"/>
  <!-- knuckle lines -->
  <line x1="50" y1="95" x2="150" y2="95" stroke="#666" stroke-width="2"/>
  <line x1="50" y1="120" x2="150" y2="120" stroke="#666" stroke-width="2"/>
  <line x1="50" y1="145" x2="150" y2="145" stroke="#666" stroke-width="2"/>
  <!-- wrist -->
  <rect x="65" y="160" width="70" height="20" rx="5" fill="#777"/>
  <!-- eye glow -->
  <circle cx="105" cy="45" r="6" fill="#f00" opacity="0.9"/>
</svg>   
