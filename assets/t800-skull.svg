<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 144" width="128" height="144">
  <defs>
    <pattern id="scan" width="2" height="2" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="128" y2="0" stroke="#000000" stroke-width="1" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Transparent Background (No fill/frame) -->

  <!-- === SILVER METALLIC T-800 PIXEL SKULL === -->
  <g transform="translate(0, 4)">
    <!-- Cranium Dome Highlights & Shading (Silver/Steel Palette) -->
    <rect x="44" y="12" width="40" height="4" fill="#d0d7de" />
    <rect x="36" y="16" width="56" height="4" fill="#8c959f" />
    <rect x="44" y="16" width="24" height="4" fill="#ffffff" /> <!-- Specular highlight -->
    <rect x="32" y="20" width="64" height="8" fill="#656d76" />
    <rect x="40" y="20" width="20" height="8" fill="#adb5bd" />
    <rect x="28" y="28" width="72" height="12" fill="#484f58" />
    <rect x="36" y="28" width="24" height="12" fill="#8c959f" />
    <!-- Temple / Side Pistons -->
    <rect x="24" y="32" width="4" height="16" fill="#30363d" />
    <rect x="100" y="32" width="4" height="16" fill="#30363d" />
    <rect x="28" y="40" width="72" height="8" fill="#656d76" />

    <!-- Heavy Brow Ridge -->
    <rect x="24" y="48" width="80" height="6" fill="#30363d" />
    <rect x="28" y="48" width="72" height="4" fill="#8c959f" />
    <rect x="58" y="48" width="12" height="8" fill="#21262d" />

    <!-- Eye Sockets (Deep Dark Recess) -->
    <rect x="28" y="54" width="72" height="16" fill="#21262d" />
    <rect x="32" y="54" width="24" height="16" fill="#080502" />
    <rect x="72" y="54" width="24" height="16" fill="#080502" />
    <!-- Metallic Socket Rims -->
    <rect x="32" y="68" width="24" height="2" fill="#656d76" />
    <rect x="72" y="68" width="24" height="2" fill="#656d76" />
    <rect x="56" y="54" width="16" height="16" fill="#656d76" />
    <rect x="60" y="54" width="8" height="14" fill="#adb5bd" /> <!-- Nose bridge highlight -->

    <!-- Glowing Red Cybernetic Eyes -->
    <rect x="38" y="58" width="12" height="8" fill="#990000" />
    <rect x="40" y="60" width="8" height="4" fill="#ff2200" />
    <rect x="42" y="61" width="4" height="2" fill="#ffaa88" /> <!-- Eye core glow -->

    <rect x="78" y="58" width="12" height="8" fill="#990000" />
    <rect x="80" y="60" width="8" height="4" fill="#ff2200" />
    <rect x="82" y="61" width="4" height="2" fill="#ffaa88" /> <!-- Eye core glow -->

    <!-- Cheekbones (Zygomatic Arch) & Nasal Cavity -->
    <rect x="24" y="70" width="80" height="10" fill="#8c959f" />
    <rect x="28" y="70" width="20" height="6" fill="#d0d7de" /> <!-- Left cheek highlight -->
    <rect x="80" y="70" width="20" height="6" fill="#656d76" />
    <!-- Nasal Opening -->
    <rect x="58" y="68" width="12" height="12" fill="#080502" />
    <rect x="62" y="68" width="4" height="12" fill="#21262d" /> <!-- Septum -->

    <!-- Maxilla / Upper Jaw & Hydraulic Side Struts -->
    <rect x="32" y="80" width="64" height="8" fill="#656d76" />
    <rect x="40" y="80" width="48" height="8" fill="#8c959f" />
    <!-- Jaw Hydraulic Pistons -->
    <rect x="32" y="82" width="6" height="18" fill="#30363d" />
    <rect x="34" y="84" width="2" height="14" fill="#d0d7de" />
    <rect x="90" y="82" width="6" height="18" fill="#30363d" />
    <rect x="92" y="84" width="2" height="14" fill="#d0d7de" />

    <!-- Teeth Grille (Upper & Lower) -->
    <rect x="44" y="88" width="40" height="12" fill="#080502" />
    <!-- Upper Teeth -->
    <rect x="46" y="88" width="4" height="5" fill="#f0f6fc" />
    <rect x="52" y="88" width="4" height="5" fill="#f0f6fc" />
    <rect x="58" y="88" width="4" height="5" fill="#ffffff" />
    <rect x="66" y="88" width="4" height="5" fill="#ffffff" />
    <rect x="72" y="88" width="4" height="5" fill="#f0f6fc" />
    <rect x="78" y="88" width="4" height="5" fill="#f0f6fc" />
    <!-- Lower Teeth -->
    <rect x="46" y="95" width="4" height="5" fill="#c9d1d9" />
    <rect x="52" y="95" width="4" height="5" fill="#c9d1d9" />
    <rect x="58" y="95" width="4" height="5" fill="#f0f6fc" />
    <rect x="66" y="95" width="4" height="5" fill="#f0f6fc" />
    <rect x="72" y="95" width="4" height="5" fill="#c9d1d9" />
    <rect x="78" y="95" width="4" height="5" fill="#c9d1d9" />

    <!-- Mandible / Chin -->
    <rect x="36" y="100" width="56" height="6" fill="#656d76" />
    <rect x="44" y="106" width="40" height="6" fill="#8c959f" />
    <rect x="52" y="106" width="24" height="4" fill="#d0d7de" /> <!-- Chin metallic highlight -->
    <rect x="48" y="112" width="32" height="3" fill="#30363d" />

    <!-- === ROBOTIC NECK & HYDRAULICS === -->
    <!-- Central Spine Column -->
    <rect x="54" y="115" width="20" height="21" fill="#30363d" />
    <rect x="58" y="115" width="12" height="21" fill="#484f58" />
    <!-- Cervical Vertebrae Segments -->
    <rect x="56" y="118" width="16" height="3" fill="#d0d7de" />
    <rect x="56" y="124" width="16" height="3" fill="#8c959f" />
    <rect x="56" y="130" width="16" height="3" fill="#656d76" />

    <!-- Left & Right Neck Hydraulic Pistons -->
    <rect x="42" y="112" width="6" height="24" fill="#21262d" />
    <rect x="44" y="112" width="2" height="24" fill="#f0f6fc" />
    <rect x="40" y="122" width="10" height="6" fill="#656d76" /> <!-- Piston collar -->

    <rect x="80" y="112" width="6" height="24" fill="#21262d" />
    <rect x="82" y="112" width="2" height="24" fill="#f0f6fc" />
    <rect x="78" y="122" width="10" height="6" fill="#656d76" /> <!-- Piston collar -->

    <!-- Collar / Base Mount -->
    <rect x="34" y="134" width="60" height="4" fill="#30363d" />
  </g>

  <!-- Subtle CRT Scanlines Overlay -->
  <rect width="128" height="144" fill="url(#scan)" pointer-events="none" />
</svg>
