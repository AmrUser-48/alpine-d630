Section "Device"
    Identifier "Intel GM965 / GMA X3100"
    Driver "intel"
    Option "AccelMethod" "sna"
    Option "TearFree" "true"
EndSection

Section "InputClass"
    Identifier "D630 keyboard layouts"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us,ua"
    Option "XkbOptions" "grp:alt_shift_toggle"
EndSection
